<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My PH SMM Panel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            text-align: center;
            padding: 50px 20px;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 500px;
            margin: auto;
        }
        h1 { color: #0070f3; }
        input[type="text"] {
            width: 90%;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }
        .btn {
            background-color: #0070f3;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            width: 95%;
            font-weight: bold;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        #statusMessage {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🚀 Maligayang Pagdating sa Aking SMM Panel</h1>
        <p>Ang #1 Subok at Mabilis na Social Media Boosting Provider sa Pilipinas!</p>
        <hr>
        <p><strong>Mga Serbisyo:</strong> Facebook Likes, TikTok Views, Instagram Followers & higit pa.</p>
        
        <!-- ORDER FORM -->
        <div style="margin-top: 20px;">
            <label for="targetUrl"><strong>I-paste ang Target Post / Profile Link:</strong></label><br>
            <input type="text" id="targetUrl" placeholder="https://facebook.com/your-post-link" required>
            <br>
            <button class="btn" onclick="sendOrder()">Order Now via GCash / Maya</button>
        </div>

        <p id="statusMessage"></p>
    </div>

    <!-- JAVASCRIPT CONNECTED TO ENGINE -->
    <script>
        async function sendOrder() {
            const linkInput = document.getElementById('targetUrl').value;
            const statusMsg = document.getElementById('statusMessage');

            if (!linkInput) {
                alert('Paki-lagay muna ang target link!');
                return;
            }

            statusMsg.style.color = 'blue';
            statusMsg.innerText = '⏳ Pinaproseso ang order mo... Pakihintay...';

            try {
                const API_URL = "https://agreement-oak-cgi-fundamentals.trycloudflare.com/api/v1/order";

                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        target_url: linkInput
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    statusMsg.style.color = 'green';
                    statusMsg.innerText = '✅ SUCCESS! ' + data.message;
                } else {
                    statusMsg.style.color = 'red';
                    statusMsg.innerText = '❌ Error: Hindi maiproseso ang order.';
                }
            } catch (error) {
                console.error(error);
                statusMsg.style.color = 'red';
                statusMsg.innerText = '❌ Offline ang Provider Engine sa Laptop.';
            }
        }
    </script>

</body>
</html>
